<!DOCTYPE html>
<html>
<head>
    <title>Food Order</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <div class="left">
    <h2>🔥 Trending</h2>

    <div class="poster">
        <img id="trendingPoster"
             src="/static/images/default_poster.png"
             alt="Trending">
        </div>
    </div>



    <div class="center">
        <h1>🍔 Food Menu</h1>

        <div class="menu">
            {% for item, price in menu.items() %}
            <div class="card">
                <img src="/static/images/{{item.lower()}}.png">
                <h3>{{ item }}</h3>
                <p>₹{{ price }}</p>
            </div>
            {% endfor %}
        </div>

        <h2>Place Order</h2>

        <form id="orderForm">
            <input type="text" name="name" placeholder="Your Name" required>

            <select name="food" required>
                <option value="">Select Food Item</option>
                {% for item, price in menu.items() %}
                    <option value="{{ item }}">
                        {{ item }} - ₹{{ price }}
                    </option>
                {% endfor %}
            </select>

            <input type="number" name="quantity" placeholder="Quantity" required>

            <button type="submit">Order</button>
            <button type="button" id="clearBtn">Clear</button>
        </form>

        <h3 id="result"></h3>

    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
